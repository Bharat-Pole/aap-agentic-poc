[pytest]
# Run from the poc/ source root: `python -m pytest` (or just `pytest`).
# rootdir is poc/, so conftest.py here puts the source packages on sys.path and
# the Phase-4 guardrail / audit / human-in-the-loop suites under tests/ import
# `agents`, `data`, and `orchestration` directly.
testpaths = tests
addopts = -q
filterwarnings =
    ignore::DeprecationWarning
